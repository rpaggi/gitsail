[package]
name = "gitsail-desktop"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "gitsail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gitsail-application = { path = "../../../crates/gitsail-application" }
gitsail-domain = { path = "../../../crates/gitsail-domain" }
gitsail-forge = { path = "../../../crates/gitsail-forge" }
gitsail-git = { path = "../../../crates/gitsail-git" }
gitsail-protocol = { path = "../../../crates/gitsail-protocol" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# T-245/US-103: parses a PR/MR's own URL (untrusted forge API content) to
# validate its scheme/host before ever opening it — see
# `commands::open_pull_request_link_impl`'s doc comment. Same `url` crate
# `gitsail-domain` already depends on for `build_web_url`.
url = "2"

[lints]
workspace = true
