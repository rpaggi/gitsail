[package]
name = "gitsail-git"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gitsail-application = { path = "../gitsail-application" }
gitsail-domain = { path = "../gitsail-domain" }
tracing = "0.1"

# T-236/US-084 criterion 3: a tiny, dedicated helper binary that
# `GitCliProvider::execute_rebase_plan` points `GIT_SEQUENCE_EDITOR` at. It
# takes no repository-derived input at all — see
# `src/bin/gitsail_sequence_editor.rs`'s own doc for why that is exactly what
# keeps the mechanism free of shell/command injection.
[[bin]]
name = "gitsail-sequence-editor"
path = "src/bin/gitsail_sequence_editor.rs"

# T-252/US-119: shared temporary-Git-fixture machinery for this crate's own
# `tests/*.rs` integration tests, consolidating what had been duplicated
# across ~9 of them. This is a dev-only edge — see
# `gitsail-test-support/src/lib.rs`'s own doc for why this crate depending
# back on `gitsail-test-support` (which has a normal dependency on this one)
# is a supported dev-dependency cycle, not a real one.
[dev-dependencies]
gitsail-test-support = { path = "../gitsail-test-support" }

[lints]
workspace = true
