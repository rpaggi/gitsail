[package]
name = "gitsail-tui"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Chosen for patch export (US-029/T-162): `arboard` is the de facto
# cross-platform (X11/Wayland/Windows/macOS) clipboard crate in the Rust
# ecosystem, has no GUI toolkit dependency (unlike `copypasta`, which pulls
# in a windowing crate this headless TUI has no other use for), and fails
# cleanly with an `Err` — never a panic or a hang — when no display server
# is reachable (the common remote-terminal/SSH case AC3 requires a fallback
# for). No clipboard dependency existed in the workspace before this story.
# `default-features = false` drops its default `image-data` feature (and
# the `image`/`objc2`/`windows-sys` dependency tree that comes with it) —
# this crate only ever copies patch text, never an image.
arboard = { version = "3", default-features = false }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
# T-251/US-109: resolves the OS config directory for the optional
# keybindings-override file (`crate::keybindings::default_config_path`),
# the same crate and major version `apps/desktop/src-tauri` already uses
# for its own preferences/recent-repositories file locations — no new
# convention introduced.
dirs = "6"
gitsail-application = { path = "../gitsail-application" }
gitsail-domain = { path = "../gitsail-domain" }
gitsail-git = { path = "../gitsail-git" }
ratatui = "0.29"

[lints]
workspace = true
