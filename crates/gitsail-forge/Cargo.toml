[package]
name = "gitsail-forge"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
gitsail-application = { path = "../gitsail-application" }
gitsail-domain = { path = "../gitsail-domain" }
# T-245/US-103: PR/MR listing needs one synchronous HTTP GET against the
# GitHub/GitLab REST APIs. `ureq` was chosen over `reqwest` because nothing
# else in this workspace uses an async runtime (SAD §4: "the rest of the
# Core is synchronous" — grepped the whole workspace for
# `reqwest`/`tokio`/`hyper` before adding this dependency; none were
# present), and pulling in `tokio` just for this one blocking call would be
# a much larger footprint change than this story's scope justifies. `tls`
# selects `ureq`'s pure-Rust (rustls) TLS backend — no system OpenSSL
# dependency — matching the same "buildable in a minimal/CI/sandboxed Linux
# environment" reasoning `keyring`'s `crypto-rust` feature above already
# documents for this crate. `json` lets adapters hand `ureq` an
# already-parsed `serde_json`/struct body directly.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# keyring's OS-storage backend is picked per platform via feature flags
# (T-244/US-102 criterion 1). `crypto-rust` on Linux avoids a system
# OpenSSL/libdbus-dev build dependency (the D-Bus Secret Service crypto
# handshake is done in pure Rust instead), keeping this buildable in a
# minimal/CI/sandboxed Linux environment that has no display session or
# secret-service daemon running to actually exercise it against (see
# module docs on the manual verification this still needs per target OS).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[lints]
workspace = true
